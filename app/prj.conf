# This file contains selected Kconfig options for the application.

CONFIG_SENSOR=y
CONFIG_BLINK=y

# Power management — demonstrate idle power optimization
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_TICKLESS_KERNEL=y

# Shell — interactive metrics reporting
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Logging
CONFIG_LOG=y

# Tracing — collect runtime metrics (CTF backend to avoid UART conflict)
CONFIG_TRACING=y
CONFIG_TRACING_BACKEND_CTF=y

# Thread statistics for CPU-load reporting
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_MONITOR=y
