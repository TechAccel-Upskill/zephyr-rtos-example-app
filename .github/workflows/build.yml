name: Build

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  packages: write

jobs:
  # Precheck: make sure the shared devcontainer image exists before relying
  # on it as a `container:`, building it if it's missing.
  ensure-image:
    uses: ./.github/workflows/devcontainer-image-ensure.yml

  # Uses the same devcontainer image developers build locally (see
  # .devcontainer/), published by devcontainer-image.yml.
  build-linux:
    name: Build app and tests (devcontainer)
    needs: ensure-image
    runs-on: ubuntu-22.04
    container: ${{ needs.ensure-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: example-application
          persist-credentials: false

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-devcontainer-${{ github.run_id }}
          restore-keys: ccache-linux-devcontainer-

      - name: West init and update
        working-directory: example-application
        run: |
          west init -l .
          west update

      - name: Build firmware
        working-directory: example-application
        run: west twister -T app -v --inline-logs --integration

      - name: Twister Tests
        working-directory: example-application
        run: west twister -T tests -v --inline-logs --integration

  # Docker containers aren't available on macOS/Windows GitHub-hosted
  # runners, so these legs still install the toolchain natively.
  build-other:
    name: Build app and tests
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: example-application
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: example-application
          toolchains: arm-zephyr-eabi
          ccache-cache-key: ${{ matrix.os }}

      - name: Build firmware
        working-directory: example-application
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_TWISTER_FLAGS="--short-build-path -O/tmp/twister-out"
          fi
          west twister -T app -v --inline-logs --integration $EXTRA_TWISTER_FLAGS

      - name: Twister Tests
        working-directory: example-application
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA_TWISTER_FLAGS="--short-build-path -O/tmp/twister-out"
          fi
          west twister -T tests -v --inline-logs --integration $EXTRA_TWISTER_FLAGS
