name: Static Analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-22.04
    # Same devcontainer image used for local development (cppcheck preinstalled).
    container: ghcr.io/techaccel-upskill/zephyr-rtos-example-app-devcontainer:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run cppcheck
        run: |
          cppcheck --error-exitcode=1 --enable=warning,style,performance,portability \
            --inline-suppr --suppress=missingIncludeSystem \
            -I include \
            app/src drivers lib
