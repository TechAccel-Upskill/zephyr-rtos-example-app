name: Static Analysis

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # Precheck: make sure the shared devcontainer image exists before relying
  # on it as a `container:`, building it if it's missing.
  ensure-image:
    uses: ./.github/workflows/devcontainer-image-ensure.yml

  cppcheck:
    name: cppcheck
    needs: ensure-image
    runs-on: ubuntu-22.04
    # Same devcontainer image used for local development (cppcheck preinstalled).
    container: ${{ needs.ensure-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run cppcheck
        run: |
          cppcheck --error-exitcode=1 --enable=warning,style,performance,portability \
            --inline-suppr --suppress=missingIncludeSystem \
            -I include \
            app/src drivers lib
